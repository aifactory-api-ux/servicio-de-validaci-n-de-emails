```yaml
openapi: 3.1.0
info:
  title: Email Validation API
  version: 1.0.0
paths:
  /validate-email:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Successful validation
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  valid:
                    type: boolean
        '400':
          description: Invalid or missing email field
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
```